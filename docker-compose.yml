services:
    backend:
        # Both image: and build: are present so `docker compose pull` (used on the
        # production VM) fetches the prebuilt image from GHCR, while a plain
        # `docker compose up --build` (used locally) still builds from source and
        # tags the result with this same name.
        image: ghcr.io/visalan-h/transport-app-backend:latest
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: transport_backend
        # Docker's default json-file driver never rotates. On a 1GB VM with a small disk that
        # fills it eventually and takes the site down in a way that looks like a mystery.
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        restart: always
        expose:
            - '3000'
        env_file:
            - ./backend/.env
        cpus: 0.75
        mem_limit: 512m
        mem_reservation: 256m
        pids_limit: 256

    frontend:
        image: ghcr.io/visalan-h/transport-app-frontend:latest
        build:
            context: .
            dockerfile: ./frontend/Dockerfile
        container_name: transport_frontend
        # Docker's default json-file driver never rotates. On a 1GB VM with a small disk that
        # fills it eventually and takes the site down in a way that looks like a mystery.
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        restart: always
        ports:
            - '80:80'
            - '443:443'
        # The real Cloudflare Origin CA pair lives on the server as ./certs/origin.{pem,key} and is
        # gitignored. Not read-only: when the directory is empty -- which is the normal case on a
        # laptop -- the entrypoint writes a self-signed placeholder into it so nginx can start.
        volumes:
            - ./certs:/etc/nginx/certs
        depends_on:
            - backend
        cpus: 0.5
        mem_limit: 256m
        mem_reservation: 96m
        pids_limit: 128

    simulation:
        # Generates synthetic bus traffic, so it must never run in production --
        # it would put fake buses on the live map. Behind a profile rather than
        # commented out or deleted on the server: the deployed box then runs the
        # same file as everyone else, and a plain `docker compose up -d` cannot
        # start it by accident. Start it locally with:
        #   docker compose --profile dev up -d
        profiles: ['dev']
        build:
            context: .
            dockerfile: simulation/Dockerfile
        container_name: transport_simulation
        # Docker's default json-file driver never rotates. On a 1GB VM with a small disk that
        # fills it eventually and takes the site down in a way that looks like a mystery.
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        env_file:
            - ./simulation/.env
        environment:
            - TARGET_URL=http://backend:3000/update
        restart: on-failure
        depends_on:
            - backend
        cpus: 0.5
        mem_limit: 256m
        mem_reservation: 96m
        pids_limit: 128
