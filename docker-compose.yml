services:
    backend:
        # Both image: and build: are present so `docker compose pull` (used on the
        # production VM) fetches the prebuilt image from GHCR, while a plain
        # `docker compose up --build` (used locally) still builds from source and
        # tags the result with this same name.
        image: ghcr.io/visalan-h/transport-app-backend:latest
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: transport_backend
        restart: always
        expose:
            - '3000'
        env_file:
            - ./backend/.env
        cpus: 0.75
        mem_limit: 512m
        mem_reservation: 256m
        pids_limit: 256

    batcher:
        image: ghcr.io/visalan-h/transport-app-batcher:latest
        build:
            context: .
            dockerfile: batcher/Dockerfile
        container_name: transport_batcher
        restart: always
        expose:
            - '4000'
        env_file:
            - ./batcher/.env
        environment:
            - TARGET_URL=http://backend:3000/update
        depends_on:
            - backend
        cpus: 0.5
        mem_limit: 384m
        mem_reservation: 128m
        pids_limit: 192

    frontend:
        image: ghcr.io/visalan-h/transport-app-frontend:latest
        build:
            context: .
            dockerfile: ./frontend/Dockerfile
        container_name: transport_frontend
        restart: always
        ports:
            - '80:80'
        depends_on:
            - backend
        cpus: 0.5
        mem_limit: 256m
        mem_reservation: 96m
        pids_limit: 128

    simulation:
        # Generates synthetic bus traffic, so it must never run in production --
        # it would put fake buses on the live map. Behind a profile rather than
        # commented out or deleted on the server: the deployed box then runs the
        # same file as everyone else, and a plain `docker compose up -d` cannot
        # start it by accident. Start it locally with:
        #   docker compose --profile dev up -d
        profiles: ['dev']
        build:
            context: .
            dockerfile: simulation/Dockerfile
        container_name: transport_simulation
        env_file:
            - ./simulation/.env
        environment:
            - TARGET_URL=http://batcher:4000/update
        restart: on-failure
        depends_on:
            - batcher
        cpus: 0.5
        mem_limit: 256m
        mem_reservation: 96m
        pids_limit: 128
