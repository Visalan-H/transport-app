# Included by every block in nginx.conf that sets headers. nginx's add_header does not merge across
# levels -- a block that names any add_header of its own drops every one inherited from its parent --
# so these have to be repeated per block, and an include is the only way to do that without four
# copies drifting apart.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The threat this addresses is a compromised dependency, not a hole in our own code: React escapes by
# default and nothing here injects HTML. But ~15 npm packages ship into every student's browser, and
# any one of them going bad upstream would run with full access to the logged-in page. connect-src is
# the load-bearing directive -- it means such code cannot send what it collects anywhere.
#
# style-src needs 'unsafe-inline' because MapLibre sets inline styles on the controls and markers it
# creates. That weakens the style directive specifically; script-src, which is the one that matters
# for code execution, stays strict.
#
# worker-src needs blob: because MapLibre runs its tile parsing in workers created from blob URLs.
# img-src needs blob: and data: for the same reason -- rendered tiles and sprites.
#
# cloudflareinsights.com is Cloudflare Web Analytics. Cloudflare injects that script at the edge, so
# it appears in no bundle and no source file here -- auditing the built assets against this policy
# finds nothing, and the only way it surfaced was a blocked-script error in a real browser console.
# Two hosts, not one: the script is served from static.cloudflareinsights.com and reports back to
# cloudflareinsights.com, so allowing only the first loads a beacon that then silently fails.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://tiles.versatiles.org https://cloudflareinsights.com; worker-src 'self' blob:" always;
