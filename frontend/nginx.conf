# Cloudflare fronts this origin, so the peer address is always a Cloudflare edge and never a
# visitor. real_ip rewrites $remote_addr to the address in CF-Connecting-IP, but only when the
# connection genuinely came from one of the ranges below — a forged header from anywhere else is
# ignored, so the firewall is a second line of defence rather than the only one.
#
# Without this, $binary_remote_addr below is the edge address: every visitor arriving through the
# same Cloudflare server would share one limit_req bucket, and X-Real-IP would be useless to the
# backend for the same reason.
#
# From https://www.cloudflare.com/ips-v4. Cloudflare adds ranges occasionally and a stale list here
# does not fail loudly — visitors behind a missing range silently collapse into one shared bucket,
# which on /auth is a 10r/m login outage for them. Worth re-checking against that page periodically.
#
# IPv4 only, deliberately: `listen 80` below binds 0.0.0.0, and Docker here has no IPv6, so nginx
# never sees an IPv6 peer and Cloudflare's v6 ranges would be dead config. Adding them means also
# adding `listen [::]:80`, which without IPv6 in the container fails to bind and stops nginx.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# These are a crude flood guard, not the real limit. Per-route limits live in the backend
# (backend/routes/authRoutes.ts): 5 OTP per 5 min, 10 logins per 5 min, and so on.
#
# $binary_remote_addr is a public IP, not a person, and that is the reason these are not tight.
# Students on campus wifi share one NAT address, and drivers on mobile data share a carrier-grade
# NAT address, so one bucket can legitimately carry dozens of people. /auth/ also covers /auth/me,
# which every page load calls, so it is not only login traffic.
#
# 60r/m was set by hand on the VM after users hit 429s. It never took effect: this file is baked
# into the frontend image at build time and the server runs prebuilt images, so a local edit there
# does nothing. Setting it here is what actually ships it.
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

# A driver posts every 5s, so ~12r/m each. The headroom is for many drivers behind one carrier NAT.
# /update needs a driver Bearer JWT, so anything unauthenticated is rejected by the backend anyway.
limit_req_zone $binary_remote_addr zone=updates:10m rate=600r/m;

server {
    listen 80;

    # Cloudflare's SSL mode used to be Flexible, which terminates TLS at the edge and then talks to
    # this origin in plain HTTP over the public internet -- session cookies, driver passwords and
    # driver JWTs all readable in transit, behind a padlock the browser shows anyway. Serving 443
    # here is what lets that mode move to Full (strict), which is the only setting that both
    # encrypts the hop and verifies who is on the other end of it.
    #
    # The certificate is a Cloudflare Origin CA cert: trusted by Cloudflare, not by browsers, which
    # is all that is needed for a hop only Cloudflare makes. It is mounted at runtime rather than
    # baked in -- this image is public on GHCR, so a private key inside it would be a published
    # private key. When nothing is mounted (local `docker compose up --build`) the entrypoint drops
    # a throwaway self-signed pair here instead, so the container still starts.
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # The map chunk is ~1MB of MapLibre uncompressed and ~300KB gzipped. Cloudflare compresses at
    # the edge, so this is invisible until a cache miss -- and then a 1GB VM ships the full
    # megabyte. Compressing here makes the origin hop cheap on every miss, not just the hits.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Both spellings of the JS type on purpose: nginx 1.21.1 changed .js in mime.types from
    # application/javascript to text/javascript, and gzip_types matches the literal string. Listing
    # only one means a base-image bump silently stops compressing the largest asset on the page.
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # Vite content-hashes every filename under /assets/ (map-DSNwXGtq.js), so a given URL's bytes
    # can never change -- a rebuild produces a new name instead. `immutable` is what stops the
    # browser revalidating on each load, which was costing a round trip before anything rendered.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html is the one file whose URL is stable while its contents change -- it carries the
        # hashed asset names, so caching it is how a deploy goes unnoticed. Revalidate every time.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://backend:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /driver/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://backend:3000/driver/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /update {
        limit_req zone=updates burst=20 nodelay;

        proxy_pass http://backend:3000/update;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /stream {
        proxy_pass http://backend:3000/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    # Deliberately /api/admin/ and not /api/, which proxied to the backend root: that let
    # /api/update reach the location ingest handler while skipping the `updates` zone above, and
    # /api/auth/* skip the `auth` zone. Every admin route lives under /admin/, so nothing else
    # needs this prefix.
    location /api/admin/ {
        proxy_pass http://backend:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}