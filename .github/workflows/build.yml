name: Build and push Docker images

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

# Two pushes to main in quick succession would otherwise race, and whichever
# finished last would win the :latest tag regardless of commit order.
concurrency:
    group: build-images
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - service: backend
                      dockerfile: backend/Dockerfile
                      image: ghcr.io/visalan-h/transport-app-backend
                    - service: batcher
                      dockerfile: batcher/Dockerfile
                      image: ghcr.io/visalan-h/transport-app-batcher
                    - service: frontend
                      dockerfile: frontend/Dockerfile
                      image: ghcr.io/visalan-h/transport-app-frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.service }} image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ matrix.image }}:latest
                      ${{ matrix.image }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
