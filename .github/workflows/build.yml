name: Build and push Docker images

on:
    push:
        branches:
            - main
    # Checks only -- the build job is gated on the event being a push, so a PR
    # gets its types and lint verified without publishing anything to GHCR.
    pull_request:
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

# Two pushes to main in quick succession would otherwise race, and whichever
# finished last would win the :latest tag regardless of commit order. Keyed by
# ref so a pull request run cannot cancel the main branch's build.
concurrency:
    group: build-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Bun strips types without checking them and no Dockerfile runs tsc, so
    # without this a type error would sail into a published image. Gating the
    # build on it costs ~30s and is the only thing standing between a broken
    # commit and the :latest tag the VM pulls.
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Typecheck backend
              working-directory: backend
              run: bun install --frozen-lockfile && bun run typecheck

            - name: Typecheck and lint frontend
              working-directory: frontend
              run: bun install --frozen-lockfile && bun run typecheck && bun run lint

    build-and-push:
        needs: checks
        # Pull requests stop at checks; only a push to main publishes images.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - service: backend
                      dockerfile: backend/Dockerfile
                      image: ghcr.io/visalan-h/transport-app-backend
                    - service: frontend
                      dockerfile: frontend/Dockerfile
                      image: ghcr.io/visalan-h/transport-app-frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.service }} image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ matrix.image }}:latest
                      ${{ matrix.image }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
